
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.authorizedRedirectUris=${CORS_AUTHORIZED_REDIRECT_URIS:http://localhost:3000/oauth2/callback}

# ========== Spring ==========
spring.application.name=api

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${SQL_DB_HOST:localhost}:${SQL_DB_PORT:5432}/${POSTGRES_DB:bus}
spring.datasource.username=${SQL_DB_USER:postgres}
spring.datasource.password=${SQL_DB_PASS:abc123}
spring.datasource.hikari.maxLifetime=30000
spring.datasource.hikari.leakDetectionThreshold=30000

spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.hibernate.ddl-auto=create

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.main.allow-bean-definition-overriding=true

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/oauth2/callback/{registrationId}
spring.security.oauth2.client.registration.google.scope[0]=email
spring.security.oauth2.client.registration.google.scope[1]=profile

# ========== Security ==========
security.jwt.token.secret-key=${JWT_SECRET}

# ========== Server ==========
server.port=${SERVER_PORT:8080}

# ========== Management Metrics ==========
management.metrics.distribution.percentiles[http.server.requests]=0.5,0.90,0.95,0.99
management.metrics.distribution.percentiles-histogram[http.server.requests]=true
management.metrics.distribution.slo[http.server.requests]=100ms,250ms,500ms,1s,2s,5s,10s,30s

management.metrics.distribution.percentiles[http.client.requests]=0.5,0.90,0.95,0.99
management.metrics.distribution.percentiles-histogram[http.client.requests]=true
management.metrics.distribution.slo[http.client.requests]=100ms,250ms,500ms,1s,2s,5s,10s,30s
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ========== Management Endpoints ==========
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true

# ========== OTLP Export ==========
management.otlp.metrics.export.url=${OTLP_EXPORT_URL:http://localhost:4318/v1/metrics}
management.otlp.metrics.export.step=10s
management.otlp.tracing.endpoint=${OTLP_TRACE_URL:http://localhost:4318/v1/traces}
management.otlp.tracing.export.step=10s
management.otlp.tags.application=app
management.otlp.distribution.percentiles-histogram.http.server.requests=true

# ========== Tracing ==========
management.tracing.sampling.probability=1.0

# ========== Prometheus ==========
management.prometheus.metrics.export.enabled=true

# ========== Logging ==========
logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO

# ========== Kafka ==========
kafka.addresses=${KAFKA_ADDRESSES:localhost:9092}
kafka.example-topic=${KAFKA_EXAMPLE_TOPIC:example-topic}
